name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Environment
        run: |
          java -version
          javac -version

      - name: Generate Temporary Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias glassnotes_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass release123 \
            -keypass release123 \
            -dname "CN=GlassNotes, OU=Android, O=GlassNotes, L=MountainView, S=CA, C=US"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Optimized Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: release123
          KEY_ALIAS: glassnotes_release
          KEY_PASSWORD: release123
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Release APK Output
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Release APK is empty"
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: Output file is not an APK"
            exit 1
          fi
          echo "Verified APK successfully: $APK_PATH"
          echo "File size: $(stat -c%s "$APK_PATH") bytes"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glassnotes-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="glassnotes-release-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="GlassNotes Release #${{ github.run_number }}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Production-optimized release APK with R8 code shrinking and resource shrinking enabled." \
            --latest

      - name: Clean Up Temporary Keystore
        if: always()
        run: |
          rm -f release.keystore
